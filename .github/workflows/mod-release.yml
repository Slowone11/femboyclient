name: Mod release

# Builds the mod on every push to main that changes it and publishes the jar as a GitHub release. Games running a jar built with
# updateRepo and updateToken download the newest release and install it when they close (ModUpdater + GitHubReleases).
#
# The repository secret MOD_DEFAULTS_PROPERTIES holds a whole mod/defaults.local.properties (server address, enrol secret,
# updateRepo, updateToken). After changing that file locally, run in mod/:
#   gh secret set MOD_DEFAULTS_PROPERTIES < defaults.local.properties

on:
  push:
    branches: [main]
    paths:
      - 'mod/**'
      - '.github/workflows/mod-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mod-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Bake in the defaults (server address, enrol secret, update token)
        env:
          MOD_DEFAULTS_PROPERTIES: ${{ secrets.MOD_DEFAULTS_PROPERTIES }}
        run: |
          if [ -z "$MOD_DEFAULTS_PROPERTIES" ]; then
            echo "::error::The MOD_DEFAULTS_PROPERTIES secret is missing"
            exit 1
          fi
          printf '%s\n' "$MOD_DEFAULTS_PROPERTIES" > defaults.local.properties
          for key in updateRepo updateToken; do
            if ! grep -Eq "^[[:space:]]*$key[[:space:]]*[=:][[:space:]]*[^[:space:]]" defaults.local.properties; then
              echo "::error::MOD_DEFAULTS_PROPERTIES has no $key, so the released jar could not update itself"
              exit 1
            fi
          done

      - name: Build (runs the unit tests)
        run: ./gradlew build --no-daemon

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/femboyclient-*.jar | grep -Ev 'sources|dev|javadoc' | head -n 1)
          if [ -z "$jar" ]; then
            echo "::error::No mod jar in build/libs"
            exit 1
          fi
          name=$(basename "$jar")
          (cd build/libs && sha256sum "$name" > "$name.sha256")
          gh release create "build-${{ github.run_number }}" "$jar" "$jar.sha256" \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}."
