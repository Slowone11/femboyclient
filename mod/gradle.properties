# Give Gradle enough memory to decompile Minecraft on first run.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with Gradle's configuration cache.
org.gradle.configuration-cache=false

# --- Fabric versions for Minecraft 26.2 ---
# Check https://fabricmc.net/develop before bumping these.
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17.21
fabric_api_version=0.161.0+26.2
# Netty proxy handlers bundled in the jar (see build.gradle). Keep at the Netty version of the oldest supported Minecraft.
netty_version=4.2.7.Final
jsoup_version=1.23.2

# --- Mod properties ---
version=0.1.0
group=com.femboyclient
